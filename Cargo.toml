[workspace]
members = [
    "cosmic-panel-bin",
    "cosmic-panel-config",
    "xdg-shell-wrapper-config",
]
resolver = "3"

[profile.dev]
opt-level = 1

[workspace.package]
license = "GPL-3.0-only"

[profile.release]
lto = "thin"

[workspace.dependencies]
sctk = { package = "smithay-client-toolkit", version = "0.20.0", features = [
    "calloop",
    "xkbcommon",
] }

[patch."https://github.com/pop-os/cosmic-protocols"]
cctk = { package = "cosmic-client-toolkit", git = "https://github.com/pop-os//cosmic-protocols", rev = "32283d7" }
cosmic-protocols = { git = "https://github.com/pop-os//cosmic-protocols", rev = "32283d7" }

# [patch."https://github.com/pop-os/xdg-shell-wrapper"]
# xdg-shell-wrapper-config = { path = "../xdg-shell-wrapper/xdg-shell-wrapper-config" }
# xdg-shell-wrapper = { path = "../xdg-shell-wrapper" }
# xdg-shell-wrapper = { git = "https://github.com/pop-os/xdg-shell-wrapper//", branch = "update" }
# xdg-shell-wrapper-config = { git = "https://github.com/pop-os/xdg-shell-wrapper//", branch = "update" }

# [patch."https://github.com/pop-os/libcosmic"]
# cosmic-config = { git = "https://github.com/pop-os/libcosmic//", branch = "theme-v2" }
# libcosmic = { git = "https://github.com/pop-os/libcosmic//", branch = "theme-v2" }
# cosmic-theme = { git = "https://github.com/pop-os/libcosmic//", branch = "theme-v2" }
# iced_tiny_skia = { git = "https://github.com/pop-os/libcosmic//", branch = "theme-v2" }

# NoctOS: illumos-patched crates. smithay is vendored here because this tree
# pins a different rev (0ff0098) than cosmic-comp does; the rest come from
# the sibling cosmic-comp and cosmic-launcher fork checkouts, as in the other
# NoctOS forks.
[patch."https://github.com/smithay/smithay"]
smithay = { path = "noctos-vendor/smithay" }

[patch.crates-io]
calloop = { path = "../cosmic-comp/noctos-vendor/calloop" }
polling = { path = "../cosmic-comp/noctos-vendor/polling" }
wayland-backend = { path = "../cosmic-comp/noctos-vendor/wayland-backend" }
drm-ffi = { path = "../cosmic-comp/noctos-vendor/drm-ffi" }
# libei bindings, a hard dependency of smithay; recvmsg flags differ on illumos
reis = { path = "../cosmic-comp/noctos-vendor/reis" }
# second, older DRM stack pulled in by softbuffer (via iced_tiny_skia)
drm-ffi-07 = { package = "drm-ffi", path = "../cosmic-comp/noctos-vendor/drm-ffi-0.7" }

# NoctOS: pop-os/softbuffer (tag cosmic-4.0, c2b2c19) with a POSIX-correct
# shm_open name.
[patch."https://github.com/pop-os/softbuffer"]
softbuffer = { path = "../cosmic-launcher/noctos-vendor/softbuffer" }
